<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#FAFAFC"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Same path, different filesystem</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">A container path is only a host path when you mount it.</text>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/>
    </marker>
  </defs>

  <text x="100" y="135" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#DC2626">WITHOUT A MOUNT</text>

  <rect x="100" y="155" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="120" y="195" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Host: ~/projects</text>
  <text x="120" y="225" font-family="Inter, Arial, sans-serif" font-size="18" fill="#991B1B">empty</text>

  <line x1="460" y1="200" x2="740" y2="200" stroke="#DC2626" stroke-width="3"/>
  <line x1="585" y1="185" x2="615" y2="215" stroke="#DC2626" stroke-width="5"/>
  <line x1="615" y1="185" x2="585" y2="215" stroke="#DC2626" stroke-width="5"/>

  <rect x="740" y="155" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="760" y="195" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Container: /home/&lt;user&gt;/...</text>
  <text x="760" y="225" font-family="Inter, Arial, sans-serif" font-size="18" fill="#991B1B">daily_report.md</text>

  <text x="100" y="365" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#16A34A">WITH A BIND MOUNT</text>

  <rect x="100" y="385" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="120" y="425" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Host: ~/projects</text>
  <text x="120" y="455" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">daily_report.md</text>

  <line x1="470" y1="430" x2="730" y2="430" stroke="#16A34A" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="600" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#16A34A">bind mount</text>

  <rect x="740" y="385" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="760" y="425" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Container: /workspace</text>
  <text x="760" y="455" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">daily_report.md</text>
</svg>
