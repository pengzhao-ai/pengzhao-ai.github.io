site:
  name: Peng Zhao
  site: 'https://pengzhao-ai.github.io'
  base: '/'
  # GitHub Pages always redirects directory URLs to a trailing slash, so the
  # generated links and canonical URLs use one too (getPermalink/getCanonical
  # read this). 'never' made `astro preview` 404 the slashed form
  # ("publications/" looked like an empty page) instead of serving it.
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: Peng Zhao — Optical Systems & Edge AI
    template: '%s — Peng Zhao'
  description: 'Camera and optical systems engineer building end-to-end frameworks across optics, imaging pipelines, and AI. 20+ peer-reviewed papers, 3 patents.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Peng Zhao
    images:
      - url: '~/assets/images/og-default.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@pengzha0'
    site: '@pengzha0'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
